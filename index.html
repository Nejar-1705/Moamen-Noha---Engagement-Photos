<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moamen & Noha - Engagement Party</title>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="splash-screen">
    <div class="tulip-icon">🌷</div>
    <h1 class="splash-title">Moamen & Noha</h1>
    <h2 class="splash-subtitle">Engagement Party</h2>
  </div>

  <div id="main-content">
    <div class="sea-card">
      <div class="card-body">
        <div id="countdown-wrapper">
          <div class="countdown-title">⏳ Time Until Our Big Day</div>
          <div class="timer">
            <div class="timer-box"><span id="days">00</span><p>Days</p></div>
            <div class="timer-box"><span id="hours">00</span><p>Hours</p></div>
            <div class="timer-box"><span id="minutes">00</span><p>Mins</p></div>
            <div class="timer-box"><span id="seconds">00</span><p>Secs</p></div>
          </div>
        </div>
      </div>
      <a href="https://maps.app.goo.gl/kTk7X2qQ9ygJhDsW7" target="_blank" class="location-btn">📍 Event Location</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
