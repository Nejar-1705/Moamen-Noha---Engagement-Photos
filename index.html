<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mo'men & Noha Engagement</title>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شاشة الترحيب -->
  <div id="splash-screen">
    <h1 class="splash-title">Mo'men & Noha</h1>
    <h2 class="splash-subtitle">Engagement Party</h2>
  </div>

  <!-- المحتوى الرئيسي -->
  <div class="main-container">
    <div class="card-content">
      <h1 class="names">Mo'men & Noha</h1>
      <h2 class="event-title">Engagement Party</h2>
      
      <div id="countdown" class="countdown">
        <div class="time-block"><span id="days">00</span><small>Days</small></div>
        <div class="time-block"><span id="hours">00</span><small>Hours</small></div>
        <div class="time-block"><span id="minutes">00</span><small>Mins</small></div>
      </div>

      <a href="https://maps.app.goo.gl/kTk7X2qQ9ygJhDsW7" target="_blank" class="loc-btn">📍 Event Location</a>
    </div>

    <!-- الصور الـ 4 -->
    <div class="gallery">
      <img src="photo1.jpg" alt="Photo 1">
      <img src="photo2.jpg" alt="Photo 2">
      <img src="photo3.jpg" alt="Photo 3">
      <img src="photo4.jpg" alt="Photo 4">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
