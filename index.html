<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moamen & Noha - Engagement Party</title>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Automatic Splash Screen -->
  <div id="splash-screen">
    <div class="tulip-icon">🌷</div>
    <h1 class="splash-title">Moamen & Noha</h1>
    <h2 class="splash-subtitle">Engagement Party</h2>
  </div>

  <!-- Main Website Content -->
  <div id="main-content">
    
    <!-- Moving Sea Card -->
    <div class="sea-card">
      <div class="card-body">
        
        <!-- Countdown Section -->
        <div id="countdown-wrapper">
          <div class="countdown-title">⏳ Time Until Our Big Day</div>
          <div class="timer">
            <div class="timer-box"><span id="days">00</span><p>Days</p></div>
            <div class="timer-box"><span id="hours">00</span><p>Hours</p></div>
            <div class="timer-box"><span id="minutes">00</span><p>Mins</p></div>
            <div class="timer-box"><span id="seconds">00</span><p>Secs</p></div>
          </div>
        </div>

        <!-- Upload Section -->
        <div id="upload-section" class="upload-section">
          <p style="margin-bottom: 8px; font-weight: bold;">Share your photos with us! 📸</p>
          <input type="file" id="file-input" multiple accept="image/*" style="display: none;" onchange="handleFileUpload(this.files)">
          <button class="upload-btn" onclick="document.getElementById('file-input').click()">Upload Photos 📤</button>
          <p id="upload-status" class="upload-status"></p>
        </div>

      </div>

      <!-- Location Link -->
      <a href="https://maps.app.goo.gl/kTk7X2qQ9ygJhDsW7" target="_blank" class="location-btn">
        📍 Event Location
      </a>
    </div>

    <!-- Photo Frames -->
    <div class="photos-grid">
      <div class="photo-frame"><img src="photo1.jpg" alt="Photo 1"></div>
      <div class="photo-frame"><img src="photo2.jpg" alt="Photo 2"></div>
      <div class="photo-frame"><img src="photo3.jpg" alt="Photo 3"></div>
      <div class="photo-frame"><img src="photo4.jpg" alt="Photo 4"></div>
    </div>

  </div>

  <script src="scripts.js"></script>
</body>
</html>
